<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Result | CropRecommend</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <nav class="navbar">
    <div class="container nav-inner"><a class="logo" href="index.html"><span
          class="logo-leaf">🌿</span>Crop<span>Recommend</span></a>
      <div class="nav-links"><a class="" href="index.html">Home</a><a class="" href="predict.html">Predict</a><a
          class="active" href="result.html">Result</a><a class="" href="history.html">History</a><a class=""
          href="about.html">About</a></div><span class="user-badge" id="userBadge"></span><button class="login-btn"
        id="authButton" type="button">Login</button><button class="mobile-menu">☰</button>
    </div>
  </nav>
  <header class="page-hero">
    <div class="container">
      <h1>Prediction Result</h1>
      <p>Top crop recommendations from your trained crop classifier.</p>
    </div>
  </header>
  <main class="container" style="padding-top:1px">
    <div class="result-layout" data-result>
      <section class="card">
        <div class="result-crop"><img class="crop-image" data-crop-image src="" alt="Recommended crop">
          <div><span class="pill">Model recommendation</span>
            <h2 class="result-name" data-crop>—</h2>
            <p class="result-text" data-reason>—</p>
            <div class="data-list" data-recommendations></div>
          </div>
        </div>
        <div class="actions"><a href="history.html">View Saved History</a><a href="predict.html">Try Another Input</a></div>
      </section>
      <section class="card">
        <h3>Your Input Details</h3>
        <div class="data-list" data-inputs></div>
      </section>
    </div>
  </main>
  <footer class="footer">Crop predictions are model estimates and are not guaranteed outcomes.
  </footer>
  <script src="js/app.js"></script>
</body>

</html>
